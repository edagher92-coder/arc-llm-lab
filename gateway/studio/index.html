<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Studio</title>
<link rel="manifest" href="/approvals/studio/manifest.webmanifest">
<link rel="apple-touch-icon" href="/approvals/studio/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060a14'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff6b2c'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#060a14; --deck:#0b1222; --raise:#111b33; --line:#1e2b4a; --line2:#2d4070;
  --ink:#eaf0ff; --mute:#a3b1d1; --faint:#8493b8;
  --cobalt:#3f6fff; --cobalt-hi:#9db8ff; --cobalt-bg:#14224a;
  --ember:#ff6b2c; --ember-ink:#1b0b03; --go:#46d39a; --wait:#f5b94a; --stop:#ff6f86;
  --display:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cobalt-hi);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* frame: header, rail (desktop) / tab bar (phone), views */
.app{display:grid;grid-template-columns:minmax(0,1fr);width:100%;max-width:100vw;grid-template-rows:auto auto minmax(0,1fr) auto;height:100dvh;grid-template-areas:"bar" "tele" "main" "nav"}
.bar{grid-area:bar;position:relative;display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));padding-top:calc(8px + env(safe-area-inset-top));background:var(--deck);border-bottom:1px solid var(--line)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:repeating-linear-gradient(115deg,var(--ember) 0 14px,transparent 14px 28px);opacity:.85;transform-origin:left;pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.rec{width:12px;height:12px;border-radius:50%;background:var(--faint);flex:none;transition:background .3s,box-shadow .3s}
.app[data-live="1"] .rec{background:var(--ember);box-shadow:0 0 0 0 #ff6b2c88;animation:tally 1.5s ease-in-out infinite}
.brand b{font:700 21px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.brand small{font:11px var(--mono);color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.sp{flex:1 1 0;min-width:0}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none;transition:background .3s}
@keyframes tally{0%{box-shadow:0 0 0 0 #ff6b2c99}70%,100%{box-shadow:0 0 0 7px #ff6b2c00}}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--ink);transition:border-color .2s,transform .12s}
.iconbtn:hover{border-color:var(--cobalt-hi)}
.iconbtn:active{transform:scale(.94)}

main{grid-area:main;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:16px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left))}
.view.on{animation:fade .28s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.intro .bar{animation:rise .5s var(--ease) both}
.intro .nav{animation:rise .5s .25s var(--ease) both}
.intro .view.on{animation:none}
.intro .view.on .sec{animation:rise .6s var(--ease) both}
.intro .view.on .sec:nth-child(1){animation-delay:.08s}
.intro .view.on .sec:nth-child(2){animation-delay:.16s}
.intro .view.on .sec:nth-child(3){animation-delay:.24s}
.intro .view.on .sec:nth-child(4){animation-delay:.32s}
.intro .view.on .sec:nth-child(n+5){animation-delay:.4s}

.nav{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);background:var(--deck);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.nav button{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;min-height:56px;padding:6px 2px;background:none;border:0;color:var(--faint);font:700 11.5px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:color .2s,background .2s}
.nav button:active{background:var(--raise)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--ember);border-radius:0 0 3px 3px;animation:fade .3s var(--ease)}
.nav .badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ember);color:var(--ember-ink);font:700 11px/18px var(--mono);text-align:center}

/* slate type */
.sec{margin:0 0 22px;min-width:0}
.sec>h2,.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px;font:700 13px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.sec>h2 small,.hd small{font:12px var(--mono);letter-spacing:.02em;text-transform:none;color:var(--faint)}
.field{margin:0 0 18px;padding-top:10px;border-top:1px solid var(--line)}
.field>label,.lab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font:700 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.field>label output,.lab output{font:600 13px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink)}
.help{font-size:12.5px;color:var(--faint);margin-top:6px}
textarea,input[type=text],input[type=number],input[type=password],select{width:100%;min-height:44px;padding:10px 12px;background:var(--deck);border:1px solid var(--line2);border-radius:6px;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:112px;line-height:1.45}
textarea:focus-visible,input:focus-visible,select:focus-visible{border-color:var(--cobalt-hi);box-shadow:0 0 0 3px #3f6fff44;outline:none}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row{display:flex;gap:8px;align-items:stretch}
.row>input{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid var(--line2);border-radius:6px;background:var(--raise);color:var(--ink);cursor:pointer;font-weight:600;text-decoration:none;transition:border-color .2s,background .2s,transform .12s var(--ease),opacity .2s}
.btn:hover:not(:disabled){border-color:var(--cobalt-hi)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--ember);color:var(--ember-ink);border-color:var(--ember);font:700 17px var(--display);letter-spacing:.12em;text-transform:uppercase;width:100%;min-height:52px;position:relative;overflow:hidden}
.btn.go:hover:not(:disabled){background:#ff814c;border-color:#ff814c}
.btn.quiet{background:transparent}
.btn.warn{color:var(--stop);border-color:#ff6f8666}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13.5px}
.btn.alt{background:transparent}
a.btn{display:inline-flex}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 12px;border:1px solid var(--line2);border-radius:6px;background:var(--deck);cursor:pointer;font-size:13.5px;transition:border-color .2s,background .2s,transform .12s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-bg)}
.chip small{color:var(--mute);font:12px var(--mono)}
input[type=range]{width:100%;height:44px;accent-color:var(--ember);margin:0;background:transparent}
.err{margin:10px 0 0;padding:10px 12px;border:1px solid #ff6f8677;border-left-width:4px;border-radius:6px;background:#ff6f8618;color:#ffb3c0;font-size:13.5px}
.fine{font-size:12.5px;color:var(--faint);margin:8px 0 0;text-align:center}
.mono{font-family:var(--mono)}

/* GPU switch */
.gpuline{display:grid;gap:8px;padding:12px;border:1px solid var(--line2);border-radius:8px;background:linear-gradient(180deg,var(--raise),var(--deck))}
.gpuline .hd{margin:0}
.gsw{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--line2);border-radius:10px;background:var(--bg)}
.gsw::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:7px;background:var(--cobalt-bg);border:1px solid var(--cobalt);transition:transform .35s var(--ease),background .3s,border-color .3s}
.gsw[data-v="llm"]::before{transform:translateX(100%);border-color:var(--go);background:#0f3327}
.gsw[data-v="video"]::before{border-color:var(--ember);background:#3a1a0b}
.gsw[data-v=""]::before{opacity:0}
.gsw button{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;background:none;border:0;border-radius:7px;color:var(--mute);font:700 15px var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:color .2s}
.gsw button[aria-checked="true"]{color:var(--ink)}
.gsw button i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.gsw button[aria-checked="true"][data-m="video"] i{background:var(--ember)}
.gsw button[aria-checked="true"][data-m="llm"] i{background:var(--go)}
.gsw[aria-busy="true"]{opacity:.7}
.gsw-msg{font-size:13px;color:var(--mute);min-height:1.2em}
.gsw-msg.bad{color:#ffb3c0}

/* create */
.split{display:grid;gap:0}
.wfs{display:grid;gap:8px}
.wf{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;min-height:44px;padding:10px 12px;background:var(--deck);border:1px solid var(--line2);border-left-width:4px;border-radius:6px;cursor:pointer;transition:border-color .2s,background .2s,transform .12s}
.wf:active{transform:scale(.985)}
.wf[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-bg);border-left-color:var(--ember)}
.wf .t{font:700 15px/1.25 var(--display);letter-spacing:.06em;text-transform:uppercase}
.wf .m{font-size:12.5px;color:var(--mute);grid-column:1/-1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wf .e{font:12.5px var(--mono);color:var(--mute);align-self:center}
.presets{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 6px;scroll-snap-type:x proximity;scroll-padding-inline:14px}
.preset{flex:none;scroll-snap-align:start;display:grid;gap:1px;text-align:left;min-height:44px;padding:8px 12px;min-width:96px;background:var(--deck);border:1px solid var(--line2);border-radius:6px;cursor:pointer;transition:border-color .2s,transform .12s}
.preset:active{transform:scale(.96)}
.preset b{font:700 14px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase}
.preset small{font:11.5px var(--mono);color:var(--mute);white-space:nowrap}
.preset[aria-pressed="true"]{border-color:var(--ember);background:#2a1409}
.seg{display:flex;width:100%;margin-bottom:8px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--deck)}
.seg button{flex:1;min-height:44px;padding:6px 8px;background:none;border:0;border-right:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--cobalt-bg);color:var(--ink);box-shadow:inset 0 -3px 0 var(--ember)}
.seg button:focus-visible{outline-offset:-3px}
.assist{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.assist .lab{margin:0}
.drop{display:grid;place-items:center;gap:4px;min-height:132px;padding:14px;border:1.5px dashed var(--line2);border-radius:8px;background:var(--deck);text-align:center;color:var(--mute);cursor:pointer;overflow:hidden;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--cobalt-hi);background:var(--cobalt-bg)}
.drop img{max-width:100%;max-height:180px;border-radius:4px;display:block}
details.adv{margin:0 0 18px;border-top:1px solid var(--line);padding-top:6px}
details.adv>summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;list-style:none;font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::after{content:"+";font:400 22px/1 var(--mono);color:var(--ember);transition:transform .25s var(--ease)}
details.adv[open]>summary::after{transform:rotate(45deg)}
details.adv .field:first-of-type{margin-top:6px}
.req{margin:0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font:12px/1.5 var(--mono);color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
.toggle{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.toggle input{appearance:none;flex:none;width:46px;height:28px;margin:0;border-radius:14px;background:var(--bg);border:1px solid var(--line2);position:relative;cursor:pointer;transition:background .25s,border-color .25s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:transform .25s var(--ease),background .25s}
.toggle input:checked{background:#3a1a0b;border-color:var(--ember)}
.toggle input:checked::after{transform:translateX(18px);background:var(--ember)}
.toggle input:focus-visible{outline:2px solid var(--cobalt-hi);outline-offset:2px}
.toggle span{flex:1;min-width:0}
.toggle small{display:block;color:var(--faint);font-size:12.5px}
.dock{position:sticky;bottom:-28px;margin:8px -14px 0;padding:12px 14px 22px;background:linear-gradient(180deg,#060a1400,var(--bg) 22%);z-index:3}
.dock .row .go{flex:1;width:auto}.dock .row .btn:not(.go){min-height:52px;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* stage */
.stage{display:grid;gap:14px;align-content:start}
.screen{position:relative;background:#000;border:1px solid var(--line2);border-radius:8px;overflow:hidden;display:grid;place-items:center;min-height:220px;max-height:66vh}
.screen::before,.screen::after{content:"";position:absolute;left:8px;right:8px;height:6px;background:repeating-linear-gradient(90deg,#1b2745 0 8px,transparent 8px 18px);opacity:.7;pointer-events:none;z-index:1}
.screen::before{top:3px}.screen::after{bottom:3px}
.screen video,.screen img{display:block;max-width:100%;max-height:66vh;margin:auto;background:#000}
.screen audio{width:90%;margin:30px 0}
.empty{padding:36px 22px;text-align:center;color:var(--mute);max-width:44ch}
.empty b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase}
.live .on-air{display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border:1px solid var(--ember);border-radius:3px;color:var(--ember);font:700 12px var(--display);letter-spacing:.2em;text-transform:uppercase}
.live .on-air i{width:8px;height:8px;border-radius:50%;background:var(--ember);animation:tally 1.2s ease-in-out infinite}
.live .on-air.wait{color:var(--wait);border-color:var(--wait)}.live .on-air.wait i{background:var(--wait)}
.eta{font:13px var(--mono);color:var(--mute);overflow-wrap:anywhere}
.eta.over{color:var(--wait)}
.live .note{color:var(--mute);font-size:14px;max-width:46ch}
.meta{display:grid;gap:10px}
.meta p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute)}
.kv b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12.5px}
.star{min-width:44px;padding:6px 10px;line-height:1;font-size:18px}
.star[aria-pressed="true"]{color:var(--ember);border-color:var(--ember)}

/* queue: call sheet */
.qgrid{display:grid;gap:22px}
.reel{display:grid;gap:8px}
.slate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--deck);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:4px;width:100%;transition:border-color .2s,background .2s}
.slate[aria-current="true"]{border-color:var(--cobalt);background:var(--cobalt-bg)}
.slate[data-s="done"]{border-left-color:var(--go)}
.slate[data-s="queued"],.slate[data-s="waiting"]{border-left-color:var(--wait)}
.slate[data-s="starting"],.slate[data-s="running"]{border-left-color:var(--ember)}
.slate[data-s="failed"]{border-left-color:var(--stop)}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;text-align:left;min-height:44px;padding:10px 0 10px 12px;background:none;border:0;cursor:pointer;min-width:0}
.pick .no{font:700 12px var(--mono);color:var(--faint);padding-top:2px}
.slate .p{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14px;overflow-wrap:anywhere}
.slate .s{grid-column:2;font-size:12.5px;color:var(--mute);display:flex;gap:2px 12px;flex-wrap:wrap}
.slate .s .t{font-family:var(--mono)}
.slate .s .t.over,.over{color:var(--wait)}
.slate .end{display:flex;gap:6px;align-items:center;padding-right:8px}
.mini{position:relative;height:3px;margin:0 12px 0 0;grid-column:1/-1;background:var(--line);overflow:hidden;border-radius:2px}
.mini i{display:block;height:100%;width:0;background:var(--ember);transition:width .8s linear}

/* gallery: contact sheet */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:grid;grid-template-rows:auto auto;padding:0;background:var(--deck);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;text-align:left;transition:border-color .2s,transform .15s var(--ease)}
.tile:hover{border-color:var(--cobalt-hi)}
.tile:active{transform:scale(.97)}
.tile .fr{position:relative;aspect-ratio:16/10;background:#000;display:grid;place-items:center;color:var(--faint);font:700 12px var(--display);letter-spacing:.14em;overflow:hidden}
.tile .fr video,.tile .fr img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{display:grid;gap:2px;padding:7px 9px 9px;min-width:0}
.tile .cap span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px}
.tile .cap small{font:11.5px var(--mono);color:var(--faint)}
.tile .fv{position:absolute;top:5px;right:6px;color:var(--ember);font-size:18px;text-shadow:0 1px 4px #000;z-index:2}
.tile .tc{position:absolute;left:6px;bottom:5px;padding:1px 5px;background:#000b;border-radius:2px;font:11px var(--mono);color:var(--ink);z-index:2}

/* skeleton */
.sk{position:relative;overflow:hidden;background:var(--deck);border:1px solid var(--line);border-radius:4px;min-height:56px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#3f6fff22 50%,transparent 80%);transform:translateX(-100%);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.sk.tall{min-height:140px}

/* system: instrument panel */
.panel{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.inst{display:grid;gap:6px;align-content:start;padding:12px;background:var(--deck);border:1px solid var(--line);border-top:3px solid var(--line2);border-radius:4px;min-width:0}
.inst h3{margin:0;font:700 11.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.inst .big{font:600 24px/1.1 var(--mono);overflow-wrap:anywhere}
.inst .big.unk{color:var(--faint);font-size:18px}
.inst p{margin:0;font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.meter{height:8px;border-radius:2px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cobalt);transition:width .6s var(--ease)}
.meter.warn i{background:var(--wait)}
.inst[data-t="video"]{border-top-color:var(--ember)}
.inst[data-t="llm"]{border-top-color:var(--go)}
.inst[data-t="blue"]{border-top-color:var(--cobalt)}
.kvlist{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.kvlist dt{color:var(--faint)}
.kvlist dd{margin:0;font-family:var(--mono);font-size:12.5px;text-align:right;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}

/* dialogs */
dialog{padding:0;border:1px solid var(--line2);border-radius:14px 14px 0 0;background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:90dvh;margin:auto auto 0;overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:sheetup .35s var(--ease)}
dialog::backdrop{background:#02050dcc;animation:fade .25s}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--deck)}
.dh h2{margin:0;font:700 16px var(--display);letter-spacing:.14em;text-transform:uppercase}
.db{padding:14px;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
dialog.wide{max-width:900px}

/* sign in + toasts + hint */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0,#10204a 0,var(--bg) 60%);z-index:30;padding:20px}
.gate form{display:grid;gap:12px;width:min(340px,100%)}
.gate h1{margin:0;font:700 34px var(--display);letter-spacing:.2em;text-transform:uppercase}
.gate p{margin:0;color:var(--mute)}
#toasts{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:8px;z-index:40;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:min(92vw,460px);padding:10px 14px;background:var(--ink);color:#0a1020;border-radius:6px;border-left:5px solid var(--cobalt);font-weight:600;box-shadow:0 10px 30px #000a;animation:rise .35s var(--ease)}
.toast.ok{border-left-color:var(--go)}.toast.err{border-left-color:#d6213f}
.toast.out{opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}
.toast button{min-height:36px;padding:4px 10px;border:1px solid #0a102066;border-radius:4px;background:transparent;color:#0a1020;font-weight:700;cursor:pointer}
.hint{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--raise);border:1px solid var(--line2);border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px #0008}
.hint span{flex:1}

/* storyboard */
.strip{min-width:0}
.strip-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.strip-h h2{margin:0;font:700 13px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.strip-h .n{font:12.5px var(--mono);color:var(--faint)}
.strip-h .spc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.strip-b{display:grid;gap:12px}
.strip[data-open="false"] .strip-b{display:none}
.strip-empty{color:var(--mute);font-size:13.5px;margin:0}
.shot{display:grid;gap:10px;align-content:start;padding:12px;background:var(--deck);border:1px solid var(--line);border-top:3px solid var(--line2);border-radius:4px}
.shot[data-s="done"]{border-top-color:var(--go)}
.shot[data-s="running"],.shot[data-s="starting"]{border-top-color:var(--ember)}
.shot[data-s="queued"],.shot[data-s="waiting"]{border-top-color:var(--wait)}
.shot[data-s="failed"]{border-top-color:var(--stop)}
.shot-h{display:flex;align-items:center;gap:8px}
.shot-h b{font:700 14px var(--display);letter-spacing:.14em}
.shot-h .pl{font:12px var(--mono);color:var(--mute);margin-left:auto;white-space:nowrap}
.shot textarea{min-height:76px;font-size:14px}
.shot-img{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.shot-img img{width:56px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none}
.shot-img span{flex:1;min-width:8ch}
.shot-side{display:grid;gap:8px}
.shot-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper output{font:13px var(--mono);color:var(--ink);min-width:9ch;text-align:center}
.stepper button{width:44px;padding:6px 0}
.lock{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:44px}
.lock input[type=checkbox]{accent-color:var(--ember);width:24px;height:24px;margin:0}
.lock-seed{width:14ch!important;min-height:44px;padding:5px 8px!important;font:12.5px var(--mono)}
.shot .acts .btn{flex:1 1 auto}
.shot .acts .go{flex:2 1 40%;width:auto;font-size:14px;min-height:44px;letter-spacing:.08em}


/* telemetry strip: tally + four sparklines, under the header on every tab */
.tele{grid-area:tele;display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px;align-items:stretch;padding:5px max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left));background:var(--deck);border-bottom:1px solid var(--line);min-width:0}
.tally{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px 0 4px;background:none;border:0;border-right:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:left;min-width:0;max-width:44vw}
.tally .lamp{width:11px;height:11px}
.tally[data-own="video"] .lamp{background:var(--ember);animation:tally 1.5s ease-in-out infinite}
.tally[data-own="llm"] .lamp{background:var(--go)}
.tally[data-own="idle"] .lamp{background:var(--cobalt-hi)}
.tally[data-own="handoff"] .lamp{background:var(--wait);animation:tally 1s ease-in-out infinite}
.tally .k{font:700 10.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;line-height:1.1}
.tally .s{display:none;font-size:12px;color:var(--ink);white-space:nowrap}
.tally .t{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tk{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1px;min-height:44px;padding:2px 4px 0;background:none;border:0;border-radius:4px;color:inherit;cursor:pointer;text-align:left;min-width:0;overflow:hidden}
.tk:hover{background:var(--raise)}
.tk .l{display:flex;justify-content:space-between;align-items:baseline;gap:4px;min-width:0}
.tk .l b{font:700 10.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.tk .l output{font:600 12px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tk .l output.unk{color:var(--faint)}
.tk .l output.held{color:var(--mute)}
.tk .g{min-height:18px;min-width:0}
.spark{display:block;width:100%;height:100%;overflow:visible}
.spark .sl{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.spark .sf{opacity:.18;stroke:none}
.tk .spark .sf{opacity:.12}
.spark .sg{stroke:var(--line2);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 3}

/* header switch: compact Video / Qwen on every tab */
.hsw .gsw{min-width:148px}
.hsw .gsw button{min-height:40px;font-size:13px;letter-spacing:.1em;gap:6px}
.hsw .gsw button i{width:7px;height:7px}

/* panes */
.livepane,.metricspane{display:none;grid-area:live;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;border-left:1px solid var(--line);padding:16px 14px 28px;background:linear-gradient(180deg,var(--deck) 0,var(--bg) 160px)}
.metricspane{grid-area:metrics}
.livehd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.livehd h2{margin:0;font:700 13px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* live render panel */
.live{display:grid;gap:12px;justify-items:center;padding:22px 16px 18px;text-align:center;width:100%}
.live .slatebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px}
.live .shotno{font:700 12px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.live .stg{font:700 19px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;max-width:36ch;overflow-wrap:anywhere}
.live .pct{font:300 56px/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.live .pct small{font-size:22px;color:var(--mute)}
.track{position:relative;width:min(440px,88%);height:14px;border-radius:3px;background:var(--deck);border:1px solid var(--line2);overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;width:100%;transform:scaleX(0);transform-origin:left;background:repeating-linear-gradient(115deg,var(--ember) 0 10px,#ff9161 10px 20px);transition:transform .9s linear;will-change:transform}
.track i::after{content:"";position:absolute;inset:0 -28px 0 0;background:inherit;animation:slide 1.2s linear infinite}
.track.ind i{width:35%;transform:none;animation:sweep 1.6s var(--ease) infinite;transition:none}
@keyframes slide{to{transform:translateX(-28px)}}
@keyframes sweep{0%{left:-35%}100%{left:100%}}
.phases{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;width:min(480px,96%);margin:0;padding:0;list-style:none}
.phases li{display:grid;gap:5px;justify-items:center;min-width:0}
.phases li i{display:block;width:100%;height:5px;border-radius:2px;background:var(--line);transition:background .4s,box-shadow .4s}
.phases li span{font:700 10px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.phases li[data-on="done"] i{background:var(--go)}
.phases li[data-on="now"] i{background:var(--ember);box-shadow:0 0 10px #ff6b2c88;animation:tally 1.2s ease-in-out infinite}
.phases li[data-on="now"] span{color:var(--ink)}
.live .stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font:12.5px var(--mono);color:var(--mute)}
.live .stats b{color:var(--ink);font-weight:500}
.live .clock{font:600 14px var(--mono);letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums}
.live .clock b{color:var(--ink);font-weight:600}
@media (max-width:420px){.live .pct{font-size:44px}.phases li span{display:none}}

/* metrics: 15-minute charts */
.mgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.mc{display:grid;gap:4px;align-content:start;padding:10px 12px 8px;background:var(--deck);border:1px solid var(--line);border-top:3px solid var(--line2);border-radius:4px;min-width:0}
.mc[data-t="cpu"]{border-top-color:var(--cobalt)}.mc[data-t="ram"]{border-top-color:var(--cobalt-hi)}.mc[data-t="vram"]{border-top-color:var(--ember)}.mc[data-t="tps"]{border-top-color:var(--go)}
.mc .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mc .l h3{margin:0;font:700 11.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.mc .l output{font:600 20px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.mc .l output.unk{color:var(--faint);font-size:16px}
.mc .l output.held{color:var(--mute)}
.mc .g{position:relative;height:64px;min-width:0}
.mc .ax{position:absolute;right:0;padding:0 3px;background:#0b1222cc;border-radius:2px;font:10px var(--mono);color:var(--faint);pointer-events:none}
.mc .ax.top{top:0}.mc .ax.bot{bottom:0}
.mc .f{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--faint)}
.gov{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.gov dt{color:var(--faint)}.gov dd{margin:0;font-family:var(--mono);font-size:12.5px;text-align:right;overflow-wrap:anywhere}

/* developer readout */
.devbar{position:fixed;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:8;padding:6px 9px;background:#02050dd9;border:1px solid var(--line2);border-radius:6px;font:11px/1.5 var(--mono);color:var(--mute);max-width:min(92vw,360px);pointer-events:none;white-space:pre-wrap}
.devbar b{color:var(--ink);font-weight:500}

/* code tab */
.coderoot{min-height:50vh;display:grid}
.coderoot>.empty{align-self:center;justify-self:center}

/* ask sheet */
.ask p{margin:0 0 14px;color:var(--mute)}

/* layout tiers: phone (< 600) bottom tabs; tablet (600–1100) Create | Live; desktop (> 1100) Create | Live | Metrics */
@media (min-width:600px){
  .app{grid-template-columns:64px minmax(0,1fr) minmax(300px,36%);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"bar bar bar" "tele tele tele" "nav main live"}
  .livepane{display:block}
  .nav{grid-template-columns:1fr;grid-auto-rows:68px;align-content:start;border-top:0;border-right:1px solid var(--line);padding:6px 0 env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .nav button{font-size:10px;letter-spacing:.08em}
  .nav button[aria-current="page"]::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .nav .badge{top:8px;left:calc(50% + 6px)}
  .nav button[data-tab="queue"]{display:none}
  .view{padding:18px 22px 32px}
  .presets{flex-wrap:wrap;overflow:visible;margin:0 0 14px;padding:0}
  .dock{margin:8px 0 -32px;padding-left:0;padding-right:0}
  .tele{grid-template-columns:minmax(150px,auto) repeat(4,minmax(0,1fr));gap:10px}
  .tally{max-width:none}
  .brand small{display:inline}
  dialog{border-radius:14px;margin:auto;max-height:86dvh}
  #toasts{bottom:24px}
  .hint{bottom:20px;max-width:420px}
  .devbar{bottom:12px}
}
@media (min-width:1101px){
  .app{grid-template-columns:72px minmax(0,1fr) minmax(340px,30%) minmax(280px,22%);grid-template-areas:"bar bar bar bar" "tele tele tele tele" "nav main live metrics"}
  .metricspane{display:block}
  .nav{grid-auto-rows:76px}
  .nav button{font-size:11.5px;letter-spacing:.1em}
  #v-create .split{grid-template-columns:minmax(0,1fr);max-width:760px}
  .view{padding:20px 28px 32px}
  .mgrid{grid-template-columns:1fr}
}
@media (max-width:599px){.brand small{display:none}.tele{gap:4px}.tally{padding:0 6px 0 2px;gap:6px}.tally .k,.tally .t{display:none}.tally .s{display:block}.tk{padding:2px 2px 0}.tk .l{flex-direction:column;align-items:flex-start;gap:0;line-height:1.1}.tk .l output{font-size:11px}.tk .g{min-height:12px}}
@media (max-width:420px){
  .brand b{font-size:19px;letter-spacing:.1em}
  .tally .k{display:none}
  .hsw .gsw{min-width:132px}
  .hsw .gsw button{font-size:12px;letter-spacing:.06em;padding:0 4px}
  .hsw .gsw button i{display:none}
}
@media (max-width:359px){.tele{grid-template-columns:auto repeat(2,minmax(0,1fr))}.tk[data-k="vram"],.tk[data-k="tps"]{display:none}}
@media (pointer:coarse){input[type=checkbox]{min-width:24px;min-height:24px}}

/* motion: system setting by default, overridable in Settings */
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){html:not([data-motion="full"]) *,html:not([data-motion="full"]) *::before,html:not([data-motion="full"]) *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <h1>Studio</h1>
    <p>Enter your gateway PIN to make video on this PC.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <button class="btn go" type="submit">Open Studio</button>
    <div class="err" id="gateErr" hidden></div>
  </form>
</div>

<div class="app intro" id="app" data-live="0" data-stream="off">
  <header class="bar">
    <div class="brand"><i class="rec" aria-hidden="true"></i><b>Studio</b><small>LTX 2.5 · Arc B60</small></div>
    <div class="sp"></div>
    <div class="hsw" id="hdrSwitch" title="Who has the GPU. One tap hands it over."></div>
    <button class="iconbtn" id="openSettings" type="button" aria-label="Settings and advanced" title="Settings and advanced"></button>
  </header>
  <div class="tele" id="tele" aria-label="Live telemetry">
    <button class="tally" id="gpu" type="button" data-own="" aria-live="polite" title="GPU owner. Opens the System tab."><i class="lamp"></i><span><span class="k">GPU</span><span class="t" id="gpuText">Connecting</span><span class="s" id="gpuShort">…</span></span></button>
  </div>
  <main>
    <section class="view" id="v-create" aria-label="Create" hidden>
      <div class="split">
        <div class="sec" id="createCol"><div class="gpuline" id="gpuRow"></div><div id="compose" style="margin-top:18px"></div></div>
        <div class="sec strip" id="strip" aria-label="Storyboard" data-open="false"></div>
      </div>
    </section>
    <section class="view" id="v-queue" aria-label="Queue" hidden>
      <div id="livePane">
        <div class="sec stagecol"><div class="livehd"><h2>Monitor</h2><small class="mono" id="liveTc"></small></div><div id="stage"></div></div>
        <div class="sec"><div class="hd"><span>On the slate</span><small id="qCount"></small></div><div class="reel" id="qList"></div></div>
      </div>
    </section>
    <section class="view" id="v-gallery" aria-label="Gallery" hidden>
      <div class="sec"><div class="hd"><span>Gallery</span><button class="chip" id="favFilter" type="button" aria-pressed="false" title="Show only starred clips">&#9733; Favourites</button></div><div class="sheet" id="sheet"></div></div>
    </section>
    <section class="view" id="v-system" aria-label="System" hidden>
      <div class="sec"><div class="hd"><span>GPU control</span><small id="sysAge"></small></div><div class="gpuline" id="gpuRow2"></div></div>
      <div class="sec" id="sysMetrics"></div>
      <div class="sec" id="comfyCol"></div>
      <div class="sec"><div class="hd"><span>Machine</span></div><div class="panel" id="sysPanel"></div></div>
      <div class="sec" id="devRaw" hidden></div>
    </section>
    <section class="view" id="v-code" aria-label="Code" hidden>
      <div class="sec"><div class="hd"><span>Code</span><small id="codeState"></small></div><div class="coderoot" id="codeRoot"></div></div>
    </section>
  </main>
  <aside class="livepane" id="livepane" aria-label="Live"></aside>
  <aside class="metricspane" id="metricspane" aria-label="Metrics"></aside>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</div>

<div id="metrics" class="sec" hidden>
  <div class="hd"><span>Telemetry</span><small id="mAge">last 15 min</small></div>
  <div class="mgrid" id="mgrid"></div>
  <div class="inst" data-t="llm" style="margin-top:10px"><h3>Governor</h3><dl class="gov" id="govList"></dl></div>
</div>

<dialog id="settings" aria-label="Settings and advanced"><div class="dh"><h2>Settings</h2><button class="btn sm" id="closeSettings" type="button">Done</button></div><div class="db" id="settingsBody"></div></dialog>
<dialog id="viewer" class="wide" aria-label="Clip"><div class="dh"><h2>Clip</h2><button class="btn sm" id="closeViewer" type="button">Close</button></div><div class="db" id="viewerBody"></div></dialog>
<dialog id="ask" aria-label="A render is running"><div class="dh"><h2>A render is running</h2></div><div class="db ask" id="askBody"></div></dialog>

<div class="hint" id="a2hs" role="note" hidden><span>Install Studio: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button class="btn sm" id="a2hsOk" type="button">Got it</button></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div class="devbar mono" id="devbar" hidden></div>

<script>
"use strict";
const B = location.pathname.replace(/studio\/?$/, "");          // "/approvals/" here, "/tts/approvals/" on the tailnet
const $ = s => document.querySelector(s);
if (B !== "/approvals/") for (const l of document.querySelectorAll('link[rel="manifest"],link[rel="apple-touch-icon"]')) l.href = B + "studio/" + l.getAttribute("href").split("/").pop();   // behind a path prefix (the tailnet)
const ACTIVE = ["queued", "waiting", "starting", "running"];
const COMFY_PORT = 8448;                                          // CueForge / ComfyUI on the tailnet
const FAST_N = 900, GAP_S = 5;                                    // the server's fast ring: 900 points, 1 s apart while watched

function renderQueue() {

const lazyVids = typeof IntersectionObserver === "function" ? new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { const v = e.target; lazyVids.unobserve(v); v.src = v.dataset.src; } }, {rootMargin: "200px"}) : null;

}

  try {

/* ---------- GPU tally (Video / Qwen / handing over / idle), from sys + the latest metric point ---------- */
function ownerNow() {
  const y = S.sys, st = statusNow(), a = st.active && st.active.state, gp = govPhase(), now = Date.now() / 1000, q = st.queued ? " · " + st.queued + " in line" : "";
