<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Studio</title>
<link rel="manifest" href="/approvals/studio/manifest.webmanifest">
<link rel="apple-touch-icon" href="/approvals/studio/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121316'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff5a36'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#121316; --panel:#1a1c20; --raised:#23262b; --line:#2e3238; --ink:#e9e6df; --muted:#8b9099; --faint:#5d626b;
  --tally:#ff5a36; --go:#5fd38d; --wait:#e8b64a; --stop:#e5677b;
  --display:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:focus-visible,.chip:focus-visible,.wf:focus-visible,.pick:focus-visible,.drop:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* frame */
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
.bar{display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:600 20px/1 var(--display);letter-spacing:.02em}
.gpu{display:flex;align-items:center;gap:9px;margin-left:auto;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);min-width:0}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.gpu .k{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:none}
.gpu[data-own="video"] .lamp{background:var(--tally);box-shadow:0 0 0 3px #ff5a3633;animation:tally 1.6s ease-in-out infinite}
.gpu[data-own="llm"] .lamp{background:var(--go)}
.gpu[data-own="handoff"] .lamp{background:var(--wait);box-shadow:0 0 0 3px #e8b64a33}
@keyframes tally{50%{box-shadow:0 0 0 6px #ff5a3600}}
.gpu span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.gpu b{font-weight:600;color:var(--ink)}

.cols{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr) minmax(280px,340px);min-height:0}
.pane{min-height:0;overflow:auto;padding:18px;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.pane h2{margin:0 0 12px;font:600 17px/1.2 var(--display);letter-spacing:.02em}
.nav{display:none}

/* compose */
.wfs{display:grid;gap:8px;margin-bottom:18px}
.wf{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.wf[aria-pressed="true"]{border-color:var(--ink);background:var(--raised)}
.wf .t{font:600 15px/1.25 var(--display);letter-spacing:.02em}
.wf .m{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.wf .e{font:12.5px var(--mono);color:var(--muted);align-self:center}
.field{margin:0 0 16px}
.field>label,.lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:13.5px;color:var(--muted)}
.field>label output{font:13px var(--mono);color:var(--ink)}
.help{font-size:12.5px;color:var(--faint);margin-top:4px}
textarea,input[type=text],input[type=number],input[type=password],select{width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
textarea{resize:vertical;min-height:112px;line-height:1.45}
textarea:focus-visible,input:focus-visible,select:focus-visible{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:8px;align-items:stretch}
.row>input{min-width:0}
.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--raised);cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font:600 16px var(--display);letter-spacing:.03em;padding:13px 16px;width:100%;min-height:44px}
.btn.quiet{background:transparent}
.btn.warn{color:var(--stop)}
.btn.sm{padding:6px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--raised)}
.chip small{color:var(--muted);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--ink);margin:2px 0}
.drop{display:grid;place-items:center;gap:4px;min-height:120px;padding:14px;border:1.5px dashed var(--line);border-radius:10px;background:var(--panel);text-align:center;color:var(--muted);cursor:pointer;overflow:hidden}
.drop.over{border-color:var(--ink)}
.drop img{max-width:100%;max-height:180px;border-radius:6px;display:block}
details.more{margin:0 0 16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:2px 0;margin-bottom:8px}
.fine{font-size:12.5px;color:var(--muted);margin:8px 0 0;text-align:center}
.dock{position:sticky;bottom:-18px;margin:0 -18px -18px;padding:12px 18px calc(18px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
a.btn{color:inherit;display:inline-block;text-decoration:none}
.err{margin:10px 0 0;padding:9px 12px;border:1px solid #e5677b66;border-radius:9px;background:#e5677b14;color:#f2a5b1;font-size:13.5px}

/* stage */
.stage{display:grid;gap:14px;align-content:start}
.screen{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:240px;max-height:68vh}
.screen video,.screen img{display:block;max-width:100%;max-height:68vh;margin:auto;background:#000}
.screen audio{width:90%;margin:30px 0}
.empty{padding:40px 24px;text-align:center;color:var(--muted);max-width:42ch}
.empty b{display:block;color:var(--ink);font:600 18px var(--display);margin-bottom:6px;letter-spacing:.02em}
.live{display:grid;gap:10px;justify-items:center;padding:36px 20px;text-align:center}
.clock{font:300 54px/1 var(--mono);letter-spacing:.02em}
.track{width:min(420px,80vw);height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.track i{display:block;height:100%;background:var(--tally);width:0;transition:width .8s linear}
.live .note{color:var(--muted);font-size:14px}
.meta{display:grid;gap:10px}
.meta p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* reel */
.reel{display:grid;gap:8px}
.slate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:0 8px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%}
.slate[aria-current="true"]{border-color:var(--ink);background:var(--raised)}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;text-align:left;padding:10px 0 10px 12px;background:none;border:0;cursor:pointer;min-width:0}
.slate .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--faint)}
.slate[data-s="done"] .dot{background:var(--go)}
.slate[data-s="queued"] .dot,.slate[data-s="waiting"] .dot{background:var(--wait)}
.slate[data-s="starting"] .dot,.slate[data-s="running"] .dot{background:var(--tally);animation:tally 1.6s infinite}
.slate[data-s="failed"] .dot{background:var(--stop)}
.slate .p{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14px}
.slate .s{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.slate .s .t{font-family:var(--mono)}


/* presets + assist modes */
.presets{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:2px 18px 6px;scroll-snap-type:x proximity;scroll-padding-inline:18px}
.preset{flex:none;scroll-snap-align:start;display:grid;gap:1px;text-align:left;padding:8px 12px;min-width:92px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.preset b{font:600 14.5px/1.2 var(--display);letter-spacing:.02em}
.preset small{font:11.5px var(--mono);color:var(--muted);white-space:nowrap}
.preset[aria-pressed="true"]{border-color:var(--tally);background:var(--raised)}
.seg{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{padding:6px 10px;background:none;border:0;border-right:1px solid var(--line);color:var(--muted);font-size:13px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.seg button:focus-visible{outline-offset:-2px}
.assist{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.assist .lab{margin:0}
.seg{display:flex;width:100%;margin-bottom:8px}
.seg button{flex:1}
.btn.alt{background:transparent}

/* storyboard */
.strip{border-top:1px solid var(--line);background:var(--panel);min-width:0}
.strip-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px}
.strip-h h2{margin:0;font:600 16px/1 var(--display);letter-spacing:.02em}
.strip-h .n{font:12.5px var(--mono);color:var(--muted)}
.strip-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.strip-b{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 14px;scroll-snap-type:x proximity}
.strip[data-open="false"] .strip-b{display:none}
.strip-empty{color:var(--muted);font-size:13.5px;padding:6px 0 10px}
.shot{flex:none;width:292px;scroll-snap-align:start;display:grid;gap:8px;align-content:start;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.shot[data-s="done"]{border-color:#5fd38d55}
.shot[data-s="running"],.shot[data-s="starting"]{border-color:#ff5a3688}
.shot[data-s="failed"]{border-color:#e5677b88}
.shot-h{display:flex;align-items:center;gap:8px}
.shot-h b{font:600 14px var(--display);letter-spacing:.04em}
.pill{font:12px var(--mono);color:var(--muted);margin-left:auto;white-space:nowrap}
.pill.over{color:var(--wait)}
.shot textarea{min-height:76px;font-size:14px}
.shot-img{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.shot-img img{width:56px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.shot-img span{flex:1;min-width:0}
.shot-side{display:grid;gap:8px}
.shot-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper output{font:13px var(--mono);color:var(--ink);min-width:9ch;text-align:center}
.stepper button{width:36px;padding:6px 0;text-align:center}
.lock{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.lock input[type=checkbox]{accent-color:var(--ink);width:18px;height:18px;margin:0}
.lock-seed{width:14ch!important;padding:5px 8px!important;font:12.5px var(--mono)}
.shot .acts .btn{flex:1 1 auto;text-align:center;padding:8px 10px}
.shot .acts .go{flex:2 1 40%}
.shot .acts .go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.over{color:var(--wait)}
.star{padding:6px 10px;min-width:36px;line-height:1;font-size:17px}
.star[aria-pressed="true"]{color:var(--tally);border-color:var(--tally)}
.reel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.reel-h h2{margin:0}
.slate .end{display:flex;gap:6px;align-items:center}
.hint{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--raised);border:1px solid var(--line);border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px #0008}
.hint span{flex:1}
.hint button{padding:6px 12px}
.eta{font:13px var(--mono);color:var(--muted)}

@media (min-width:981px){
  .presets{flex-wrap:wrap;overflow:visible;margin:0 0 16px;padding:0}
  .strip{max-height:40vh;display:flex;flex-direction:column}
  .strip-b{align-items:start;overflow-y:auto;min-height:0}
  .shot{width:540px;grid-template-columns:minmax(0,1fr) 210px;grid-template-areas:"head head" "prompt side" "acts acts";gap:8px 12px}
  .shot-h{grid-area:head}
  .shot>textarea{grid-area:prompt;height:100%;min-height:96px;resize:none}
  .shot-side{grid-area:side;display:grid;gap:8px;align-content:start}
  .shot>.acts{grid-area:acts}
}
/* sign in + toast */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;padding:20px}
.gate form{display:grid;gap:12px;width:min(340px,100%)}
.gate h1{margin:0;font:600 28px var(--display)}
.gate p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:20;max-width:90vw}

@media (max-width:980px){
  .cols{grid-template-columns:1fr;padding-bottom:64px}
  .pane{border-right:0;padding:14px;display:none}
  .presets{margin:0 -14px 16px;padding:2px 14px 6px}
  .strip{display:none;overflow:auto;padding-bottom:64px;border-top:0}
  .app[data-tab="shots"] .cols{display:none}
  .app[data-tab="shots"] .strip{display:block}
  .strip .strip-b{display:flex!important;padding:4px 14px 14px}
  .strip-h{padding:12px 14px 4px}
  .strip .tog{display:none}
  .shot{width:min(86vw,320px)}
  .dock{bottom:-14px;margin:0 -14px -14px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
  .app[data-tab="create"] .pane.c,.app[data-tab="stage"] .pane.s,.app[data-tab="reel"] .pane.r{display:block}
  .nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);z-index:5}
  .nav button{padding:14px 4px;background:none;border:0;color:var(--muted);font:600 15px var(--display);letter-spacing:.02em;cursor:pointer}
  .nav button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}
  .gpu span.long{display:none}
  .hint{bottom:calc(72px + env(safe-area-inset-bottom))}
  .clock{font-size:44px}
}
@media (max-width:980px),(pointer:coarse){
  .btn,.btn.sm,.chip,.wf,.preset,.nav button,.pick,.seg button,.stepper button,.star,.hint button{min-height:44px}
  .star{min-width:44px}
  .seg button{padding:6px 12px}
  input[type=text],input[type=number],input[type=password],select{min-height:44px}
  input[type=range]{height:44px}
  .lock{min-height:44px}.lock input[type=checkbox]{width:24px;height:24px}
  .drop{min-height:132px}
}
@media (max-width:400px){
  .bar{gap:10px;padding-left:12px;padding-right:12px}
  .gpu{padding:6px 10px;gap:7px}
  .pane{padding:12px}
  .dock{margin:0 -12px -14px;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
  .presets{margin:0 -12px 16px;padding:2px 12px 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <h1>Studio</h1>
    <p>Enter your gateway PIN to make video on this PC.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <button class="btn go" type="submit">Open Studio</button>
    <div class="err" id="gateErr" hidden></div>
  </form>
</div>

<div class="app" id="app" data-tab="create">
  <header class="bar">
    <div class="brand">Studio</div>
    <div class="gpu" id="gpu" data-own="" role="status" aria-live="polite" title="Green: Qwen has the GPU. Amber: handing over. Orange: video is rendering and Qwen is paused."><i class="lamp"></i><span class="k">GPU</span><span id="gpuText">Connecting</span></div>
  </header>
  <main class="cols">
    <section class="pane c" id="compose" aria-label="Create"></section>
    <section class="pane s" id="stage" aria-label="Preview"></section>
    <section class="pane r" id="reelPane" aria-label="Queue and library"><div class="reel-h"><h2>Reel</h2><button class="chip" id="favFilter" type="button" aria-pressed="false" title="Show only starred clips">&#9733; Favourites</button></div><div class="reel" id="reel"></div></section>
  </main>
  <section class="strip" id="strip" aria-label="Storyboard" data-open="false"></section>
  <nav class="nav" id="nav">
    <button data-tab="create" aria-current="true">Create</button>
    <button data-tab="stage">Preview</button>
    <button data-tab="shots">Shots</button>
    <button data-tab="reel">Reel</button>
  </nav>
</div>
<div class="hint" id="a2hs" role="note" hidden><span>Install Studio: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button class="btn sm" id="a2hsOk" type="button">Got it</button></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const B = location.pathname.replace(/studio\/?$/, "");          // "/approvals/" here, "/tts/approvals/" on the tailnet
const $ = s => document.querySelector(s);
if (B !== "/approvals/") for (const l of document.querySelectorAll('link[rel="manifest"],link[rel="apple-touch-icon"]')) l.href = B + "studio/" + l.getAttribute("href").split("/").pop();   // behind a path prefix (the tailnet)
const ACTIVE = ["queued", "waiting", "starting", "running"];
const S = {wfs: [], wf: null, vals: {}, jobs: [], sel: null, status: null, upload: null, busy: false, seen: {}, enabled: true,
           mode: "single", shots: [], stripOpen: null, favOnly: false};

/* per-viewer convenience only: every access is guarded, and the app works without it */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window or blocked storage */ } }
};

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }
function mmss(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function ago(t) { const s = Date.now() / 1000 - t; return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 129600 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; }
function lock() { const g = $("#gate"); g.hidden = false; $("#pin").focus(); }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wfByName = n => S.wfs.find(w => w.name === n);

  try { await api(what, {method: "POST", json: {id}}); if (what === "delete") S.sel = null; toast(what === "cancel" ? "Stopping" : "Deleted"); await refresh(); } catch (x) { toast(x.message); }
}
/* Remix: put a finished (or failed) job's prompt and settings back into Create */
function remix(j) {

  const p = j.params || {};
  S.vals = {}; for (const k of ["prompt", "negative", "seed"]) if (p[k] !== undefined) S.vals[k] = p[k];
  S.wf = null; S.upload = null; pickWf(j.workflow); const w = wfNow();
  for (const k of Object.keys(p)) if (w.params[k] && !["image", "frames"].includes(k)) S.vals[k] = p[k];
  if (p.seconds == null && p.frames && secRange(w)) S.vals.seconds = Math.round((p.frames - 1) / (w.fps || 24) * 2) / 2;
  if (w.sizes.length && p.width) { const i = w.sizes.findIndex(s => s[0] === p.width && s[1] === p.height); if (i >= 0) S.vals.size = i; }
  delete S.vals.image; renderCompose(); tab("create");
  toast(j.has_image && w.params.image ? "Remixed. Add the start image again." : "Remixed. Change anything and press Make video.");
}

/* last frame of a finished clip, as a png blob. Loads its own hidden video so the preview does not have to be open. */
function grabLastFrame(j) {
  return new Promise((res, rej) => {
    const c = j.clips[0], v = document.createElement("video"); let done = false;
    const fin = (f, a) => { if (done) return; done = true; clearTimeout(to); v.removeAttribute("src"); v.load(); f(a); };
    const to = setTimeout(() => fin(rej, new Error("The clip took too long to load")), 20000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onerror = () => fin(rej, new Error("The clip could not be read"));
    v.onloadedmetadata = () => { v.currentTime = isFinite(v.duration) ? Math.max(0, v.duration - 0.05) : 1e6; };
    v.onseeked = () => {

      try { cv.getContext("2d").drawImage(v, 0, 0); } catch (e) { return fin(rej, e); }
      cv.toBlob(b => b ? fin(res, b) : fin(rej, new Error("Could not capture the frame")), "image/png");

}
async function thumbOf(blob) {

    const k = 96 / Math.max(img.naturalWidth, 1), cv = document.createElement("canvas"); cv.width = 96; cv.height = Math.max(1, Math.round(img.naturalHeight * k));

  } catch (e) { return ""; }
}

  const blob = await grabLastFrame(j), d = await api("upload", {method: "POST", body: blob, headers: {"X-Filename": "frame.png"}});
  return {name: d.name, url: URL.createObjectURL(blob), thumb: await thumbOf(blob)};
}
async function continueFrom(j, btn) {
  const w = S.wfs.find(x => x.params.image); if (!w) return toast("No image-to-video workflow is installed");
  const was = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = "Grabbing frame"; }
  try {
    S.upload = await uploadFrame(j); S.vals.image = S.upload.name; S.vals.prompt = ""; S.mode = "continue"; pickWf(w.name); tab("create"); toast("Last frame is ready. Say what happens next.");
  } catch (x) { toast(x.message); } finally { if (btn) { btn.disabled = false; btn.textContent = was; } }
}

/* ---------- storyboard ---------- */
const newId = () => "s" + Math.random().toString(36).slice(2, 9);
function saveFlags() { store.set("studio.ui.v1", {mode: S.mode, open: S.stripOpen, fav: S.favOnly}); }
function saveUi() { saveFlags(); store.set("studio.shots.v1", S.shots.map(s => ({id: s.id, prompt: s.prompt, image: s.image ? {name: s.image.name, thumb: s.image.thumb || ""} : null, seconds: s.seconds, lock: !!s.lock, seed: s.seed, job: s.job || null}))); }
function loadUi() {
  const ui = store.get("studio.ui.v1"); if (ui && typeof ui === "object") { if (["single", "multi", "continue"].includes(ui.mode)) S.mode = ui.mode; if (typeof ui.open === "boolean") S.stripOpen = ui.open; S.favOnly = ui.fav === true; }
  const sh = store.get("studio.shots.v1");
  if (Array.isArray(sh)) S.shots = sh.slice(0, 24).filter(x => x && typeof x === "object").map(x => ({id: typeof x.id === "string" ? x.id : newId(), prompt: String(x.prompt || "").slice(0, 2000),
    image: x.image && typeof x.image.name === "string" && /^up_[0-9a-f]{12}\.(png|jpg|webp)$/.test(x.image.name) ? {name: x.image.name, thumb: typeof x.image.thumb === "string" && x.image.thumb.startsWith("data:image/") ? x.image.thumb : ""} : null,
    seconds: +x.seconds || 4, lock: !!x.lock, seed: Number.isFinite(+x.seed) && x.seed != null ? +x.seed : null, job: typeof x.job === "string" ? x.job : null}));
}
function shotWf(s) {
  const cur = wfNow(); if (!cur) return null;
  if (s.image) return cur.params.image ? cur : S.wfs.find(w => w.params.image) || null;
  return !(cur.params.image && cur.params.image.required) ? cur : S.wfs.find(w => !(w.params.image && w.params.image.required)) || null;
}
function sizeFor(w) {
  const cur = wfNow(); if (!w.sizes.length) return 0;
  const sz = cur && cur.sizes[S.vals.size || 0]; const i = sz ? w.sizes.findIndex(x => x[0] === sz[0] && x[1] === sz[1]) : -1; return i >= 0 ? i : 0;
}
function shotSecs(s) { const w = shotWf(s) || wfNow(), sr = w && secRange(w); return sr ? snapSecs(sr, s.seconds) : s.seconds; }
function addShot(init) {
  const w = wfNow(), sr = w && secRange(w);
  const s = Object.assign({id: newId(), prompt: "", image: null, seconds: sr ? sr.def : 4, lock: false, seed: null, job: null}, init || {});
  S.shots.push(s); S.stripOpen = true; saveUi(); renderStrip(); return s;
}
function addFromCreate() {
  const w = wfNow(), up = S.upload;
  addShot({prompt: S.vals.prompt || "", seconds: S.vals.seconds != null ? S.vals.seconds : undefined, image: S.vals.image && up ? {name: up.name, thumb: up.thumb || ""} : null,
    lock: S.vals.seed != null, seed: S.vals.seed != null ? S.vals.seed : null});
  toast("Added to the storyboard"); if (matchMedia("(min-width:981px)").matches) { const b = $("#stripBody"); if (b) b.scrollLeft = b.scrollWidth; }
}
function shotJob(s) { return s.job ? S.jobs.find(j => j.id === s.job) : null; }
async function makeShot(s, quiet) {
  const w = shotWf(s); if (!w) { toast("No workflow can make this shot"); return false; }
  const v = Object.assign({}, S.vals, {prompt: s.prompt, seconds: shotSecs(s), image: s.image ? s.image.name : undefined, seed: s.lock && s.seed != null ? s.seed : undefined, size: sizeFor(w)});
  if (!w.params.image) delete v.image;
  const r = buildParams(w, v); if (r.error) { toast("Shot " + (S.shots.indexOf(s) + 1) + ": " + r.error); return false; }
  try { const d = await api("generate", {method: "POST", json: {workflow: w.name, params: r.params}}); s.job = d.id; saveUi(); if (!quiet) { toast(d.position > 1 ? "Queued, " + (d.position - 1) + " ahead" : "Queued"); await refresh(); } return true; }
  catch (x) { toast(x.message); return false; }
}
async function makeAll(btn) {
  const todo = S.shots.filter(s => (s.prompt || "").trim()); if (!todo.length) return toast("Write a prompt in at least one shot");
  btn.disabled = true; let n = 0;
  try { for (const s of todo) { if (await makeShot(s, true)) n++; else break; } }
  finally { btn.disabled = false; saveUi(); await refresh(); }
  if (n) toast(n + (n === 1 ? " shot" : " shots") + " queued, in order");
}
async function continueShot(s, btn) {
  const j = shotJob(s); if (!j || j.state !== "done" || !j.clips.length) return toast("Make this shot first");
  const was = btn.textContent; btn.disabled = true; btn.textContent = "Grabbing frame";
  try {
    const img = await uploadFrame(j), i = S.shots.indexOf(s);
    S.shots.splice(i + 1, 0, {id: newId(), prompt: "", image: {name: img.name, thumb: img.thumb}, seconds: s.seconds, lock: s.lock, seed: s.seed, job: null});
    saveUi(); renderStrip(); toast("Next shot starts from the last frame. Say what happens next.");
    const ta = document.querySelector('[data-shot="' + S.shots[i + 1].id + '"] textarea'); if (ta) { ta.scrollIntoView({inline: "center", block: "nearest"}); ta.focus(); }
  } catch (x) { toast(x.message); btn.disabled = false; btn.textContent = was; }
}
async function shotImage(s, f) {
  if (!f) return;
  try { const d = await api("upload", {method: "POST", body: f, headers: {"X-Filename": f.name || "image"}}); s.image = {name: d.name, thumb: await thumbOf(f)}; saveUi(); renderStrip(); }
  catch (x) { toast(x.message); }
}
function renderStrip() {
  const root = $("#strip");
  if (S.stripOpen == null) S.stripOpen = S.shots.length > 0;
  root.dataset.open = String(S.stripOpen); root.replaceChildren();
  const mk = h("button", {class: "btn sm", type: "button", disabled: !S.shots.length || !S.enabled, onclick: e => makeAll(e.currentTarget)}, "Make all");
  root.append(h("div", {class: "strip-h"}, h("h2", {}, "Storyboard"), h("span", {class: "n"}, S.shots.length ? S.shots.length + (S.shots.length === 1 ? " shot" : " shots") : "no shots yet"),
    h("div", {class: "sp"}, h("button", {class: "btn sm", type: "button", onclick: () => addShot()}, "Add shot"), mk,
      h("button", {class: "btn sm quiet tog", type: "button", "aria-expanded": String(S.stripOpen), onclick: () => { S.stripOpen = !S.stripOpen; saveUi(); renderStrip(); }}, S.stripOpen ? "Hide" : "Show"))));
  const body = h("div", {class: "strip-b", id: "stripBody"});
  if (!S.shots.length) body.append(h("p", {class: "strip-empty"}, "Plan a sequence: add a shot per scene, set each length, then Make all. Use Continue from last frame to chain one shot into the next."));
  S.shots.forEach((s, i) => body.append(shotCard(s, i)));
  root.append(body); syncShots();
}
function shotCard(s, i) {
  const w = shotWf(s) || wfNow();
  const ta = h("textarea", {rows: 3, maxlength: 2000, "aria-label": "Shot " + (i + 1) + " prompt", placeholder: s.image ? "What happens next" : "Describe this shot", oninput: e => { s.prompt = e.target.value; saveUi(); }}); ta.value = s.prompt;
  const file = h("input", {type: "file", accept: "image/png,image/jpeg,image/webp", hidden: true, onchange: e => shotImage(s, e.target.files[0])});
  const secOut = h("output", {"aria-live": "polite"}, w ? lenText(w, shotSecs(s)) : s.seconds + " s");
  const step = d => { const sr = w && secRange(w); if (!sr) return; s.seconds = clamp(shotSecs(s) + d * sr.step, sr.min, sr.max); secOut.textContent = lenText(w, s.seconds); saveUi(); };
  const seed = h("input", {type: "number", class: "lock-seed", inputmode: "numeric", "aria-label": "Shot " + (i + 1) + " seed", hidden: !s.lock, oninput: e => { s.seed = e.target.value === "" ? null : +e.target.value; saveUi(); }}); seed.value = s.seed ?? "";
  const lockBox = h("input", {type: "checkbox", checked: s.lock, onchange: e => { s.lock = e.target.checked; if (s.lock && s.seed == null) { s.seed = Math.floor(Math.random() * 2147483647); seed.value = s.seed; } seed.hidden = !s.lock; saveUi(); }});
  const qw = h("button", {class: "btn sm alt", type: "button", onclick: e => writeWithQwen(s.prompt, s.image ? "continue" : "single", e.currentTarget, t => { s.prompt = t; ta.value = t; saveUi(); })}, "Write");
  return h("article", {class: "shot", "data-shot": s.id, "data-s": ""},
    h("div", {class: "shot-h"}, h("b", {}, "SHOT " + (i + 1)), h("span", {class: "pill"}, ""),
      h("button", {class: "btn sm quiet", type: "button", "aria-label": "Remove shot " + (i + 1), onclick: () => { S.shots.splice(S.shots.indexOf(s), 1); saveUi(); renderStrip(); }}, "Remove")),
    ta,
    h("div", {class: "shot-side"}, h("div", {class: "shot-img"}, s.image && s.image.thumb ? h("img", {src: s.image.thumb, alt: "Start image for shot " + (i + 1)}) : "", h("span", {}, s.image ? "Starts from an image" : "Text only"), file,
      h("button", {class: "btn sm", type: "button", onclick: () => file.click()}, s.image ? "Replace" : "Add image"),
      s.image ? h("button", {class: "btn sm quiet", type: "button", onclick: () => { s.image = null; saveUi(); renderStrip(); }}, "Clear") : ""),
    h("div", {class: "shot-r"}, h("span", {}, "Length"), h("span", {class: "stepper"}, h("button", {class: "btn sm", type: "button", "aria-label": "Shorter", onclick: () => step(-1)}, "−"), secOut,
      h("button", {class: "btn sm", type: "button", "aria-label": "Longer", onclick: () => step(1)}, "+")),
      h("label", {class: "lock"}, lockBox, "Lock seed"), seed)),
    h("div", {class: "acts"}, h("button", {class: "btn go", type: "button", "data-do": "make", onclick: () => makeShot(s)}, "Make this shot"), qw,
      h("button", {class: "btn", type: "button", "data-do": "next", hidden: true, onclick: e => continueShot(s, e.currentTarget)}, "Continue from last frame"),
      h("button", {class: "btn quiet", type: "button", "data-do": "view", hidden: true, onclick: () => { S.sel = s.job; renderReel(); renderStage(); tab("stage"); }}, "View"),
      h("button", {class: "btn", type: "button", "data-do": "again", hidden: true, onclick: e => { const j = shotJob(s); if (j) rerun(j, e.currentTarget); }}, "Run again"),
      h("button", {class: "btn star", type: "button", "data-do": "fav", hidden: true, "aria-label": "Favourite shot " + (i + 1), onclick: () => { const j = shotJob(s); if (j) toggleFav(j); }}, "\u2606")));
}
/* in-place status for each card (pill, state colour, continue/view buttons) so typing is never interrupted */
function syncShots() {
  for (const s of S.shots) {
    const c = document.querySelector('[data-shot="' + s.id + '"]'); if (!c) continue;
    const j = shotJob(s), pill = c.querySelector(".pill"), st = j ? j.state : "";
    c.dataset.s = st; c.querySelector('[data-do="next"]').hidden = !(j && st === "done" && j.clips.length && j.clips[0].type.startsWith("video"));
    c.querySelector('[data-do="view"]').hidden = !j;
    c.querySelector('[data-do="again"]').hidden = !(j && !ACTIVE.includes(st));
    const sb = c.querySelector('[data-do="fav"]'); sb.hidden = !j; if (j) paintStar(sb, j);
    if (j && ACTIVE.includes(st)) {
      pill.dataset.t0 = String(st === "running" ? (j.started || j.created) : j.created); pill.dataset.est = String(st === "running" ? estSec(wfByName(j.workflow)) : 0);
      pill.dataset.pre = {queued: "In line ", waiting: "Waiting ", starting: "Starting ", running: "Rendering "}[st];
    } else { delete pill.dataset.t0; pill.classList.remove("over"); pill.textContent = j ? {done: "Ready", failed: "Failed", cancelled: "Cancelled"}[st] || st : ""; }
  }
  tickAll();
}

/* ---------- reel ---------- */
function renderReel() {
  const r = $("#reel"); r.replaceChildren();
  const ff = $("#favFilter"); ff.setAttribute("aria-pressed", String(S.favOnly));
  const list = S.favOnly ? S.jobs.filter(j => j.fav) : S.jobs;
  if (!list.length) { r.append(h("p", {class: "help"}, S.favOnly ? "No favourites yet. Star a clip and it stays here." : "Your clips will collect here.")); return; }
  for (const j of list) {
    const label = {queued: "In line", waiting: "Waiting", starting: "Starting", running: "Rendering", done: "Ready", failed: "Failed", cancelled: "Cancelled"}[j.state] || j.state;
    const live = ACTIVE.includes(j.state), w = wfByName(j.workflow);
    const tm = live ? h("span", {class: "t", "data-t0": String(j.state === "running" ? (j.started || j.created) : j.created), "data-est": String(j.state === "running" ? estSec(w) : 0)}, "")
      : j.seconds ? h("span", {class: "t"}, "took " + mmss(j.seconds)) : "";
    r.append(h("div", {class: "slate", "data-s": j.state, "aria-current": String(j.id === S.sel)},
      h("button", {class: "pick", type: "button", onclick: () => { S.sel = j.id; renderReel(); renderStage(); tab("stage"); }},
        h("i", {class: "dot"}), h("div", {class: "p"}, title(j)), h("div", {class: "s"}, h("span", {}, label), h("span", {}, ago(j.created)), tm)),
      h("div", {class: "end"}, h("button", {class: "btn sm", type: "button", title: "Load this prompt and its settings into Create", "aria-label": "Remix: " + title(j).slice(0, 60), onclick: () => remix(j)}, "Remix"), starBtn(j, false))));
  }
  tickAll();
}
function tickAll() {
  if (S.tick) S.tick();
  document.querySelectorAll("[data-t0]").forEach(el => {
    const s = Date.now() / 1000 - (+el.dataset.t0), est = +el.dataset.est || 0;
    el.textContent = (el.dataset.pre || "") + mmss(s) + (est ? " / ~" + Math.round(est / 60) + " min" : "") + (est && s > est ? " · long" : "");
    el.classList.toggle("over", !!est && s > est);

}

/* ---------- polling ---------- */
function renderGpu() {
  const s = S.status, g = $("#gpu"), t = $("#gpuText"); if (!s) return;
  g.dataset.own = s.gpu; t.replaceChildren();
  const q = s.queued ? " · " + s.queued + " in line" : "", a = s.active && s.active.state;
  if (!s.enabled) { g.dataset.own = ""; t.append("Video is not set up on this PC"); return; }
  if (s.gpu === "video" && a === "starting") { g.dataset.own = "handoff"; t.append(h("b", {}, "Switching to Video"), h("span", {class: "long"}, " · Qwen is unloading" + q)); }
  else if (s.gpu === "video") t.append(h("b", {}, "Video"), h("span", {class: "long"}, " · rendering, Qwen is paused" + q));
  else if (a === "waiting") { g.dataset.own = "handoff"; t.append(h("b", {}, "Qwen"), h("span", {class: "long"}, " · finishing up, then your clip starts" + q)); }
  else t.append(h("b", {}, "Qwen"), h("span", {class: "long"}, (s.active ? " · your clip is next" : " · idle, ready for a clip") + q));
}
async function refresh() {
  try {
    const [jobs, st] = await Promise.all([api("jobs"), api("status")]);
    S.jobs = jobs; S.status = st; S.enabled = st.enabled;
    for (const j of jobs) { if (S.seen[j.id] && S.seen[j.id] !== j.state && j.state === "done") { toast("Clip ready"); if (!S.sel || S.sel === j.id) { S.sel = j.id; } } S.seen[j.id] = j.state; }
    if (!S.sel && jobs.length) S.sel = (jobs.find(j => j.state === "done") || jobs[0]).id;
    renderGpu(); renderReel(); renderStage(); syncShots();
    const busy = jobs.some(j => ACTIVE.includes(j.state));

    return busy;
  } catch (x) { if (x.message !== "signed out") $("#gpuText").textContent = "Cannot reach the PC"; return false; }
}
let timer;
async function loop() { clearTimeout(timer); const busy = await refresh(); timer = setTimeout(loop, busy ? 3000 : 9000); }
setInterval(tickAll, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loop(); });

$("#favFilter").addEventListener("click", () => { S.favOnly = !S.favOnly; saveFlags(); renderReel(); });

/* iOS has no install prompt: say once how to add the app to the Home Screen, unless it is already running as one */
(function () {
  const standalone = navigator.standalone === true || (matchMedia && matchMedia("(display-mode: standalone)").matches);
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (standalone || !ios || store.get("studio.a2hs.v1")) return;
  $("#a2hs").hidden = false;
  $("#a2hsOk").addEventListener("click", () => { $("#a2hs").hidden = true; store.set("studio.a2hs.v1", true); });
})();

async function boot() {
  try {
    loadUi();
    const d = await api("workflows"); S.wfs = d.workflows; S.enabled = d.enabled;
    if (!S.wfs.length) { $("#compose").replaceChildren(h("h2", {}, "Create"), h("div", {class: "empty"}, h("b", {}, "No workflows installed"), "Put workflow files in the gateway's video workflows folder.")); }
    else { if (!S.wf || !S.wfs.some(w => w.name === S.wf)) pickWf(S.wfs[0].name); else renderCompose(); }
    renderStrip(); loop();
  } catch (x) { if (x.message !== "signed out") $("#gpuText").textContent = "Cannot reach the PC"; }
}
boot();
