<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070D1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Qwen Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --abyss: #070D1F; --cobalt: #12245C; --rim: #3D6BFF; --frost: #E6EEFF; --mist: #8E9BC4; --ember: #FF7A2F;
  --glass: rgba(18, 36, 92, .38); --line: rgba(61, 107, 255, .22);
  --lvl: 0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 100%, #0f1d4a 0%, var(--abyss) 62%) fixed, var(--abyss);
  color: var(--frost); font: 16px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
  padding: env(safe-area-inset-top) 0 0;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rim); outline-offset: 3px; }

header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.brand { flex: 1; min-width: 0; }
.brand b { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand span { display: block; font-size: 12.5px; color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0; background: var(--glass); border: 1px solid var(--line); }
.icon svg { width: 20px; height: 20px; }

#log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
#log:empty::before { content: "Tap the orb and talk. Your voice is transcribed and answered on your PC, nothing leaves your tailnet."; margin: auto; max-width: 30ch; text-align: center; color: var(--mist); font-size: 15px; }
.msg { max-width: min(86%, 62ch); white-space: pre-wrap; overflow-wrap: anywhere; }
.me { align-self: flex-end; background: rgba(61, 107, 255, .16); border: 1px solid var(--line); border-radius: 18px 18px 6px 18px; padding: 10px 14px; }
.ai { align-self: flex-start; padding: 2px 2px; font-size: 16.5px; }
.ai.live { color: #fff; }
.meta { display: block; font-size: 12px; color: var(--mist); margin-top: 6px; }
.err { color: #ffb38a; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 14px 16px 4px; }
#orb {
  position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.55) 0 6%, rgba(255,255,255,0) 18%),
    radial-gradient(circle at 50% 62%, rgba(255,122,47,.20) 0 22%, rgba(255,122,47,0) 46%),
    radial-gradient(circle at 50% 50%, rgba(61,107,255,.30), rgba(18,36,92,.85) 70%, rgba(7,13,31,.95));
  box-shadow: inset 0 -14px 30px rgba(61,107,255,.35), inset 0 10px 22px rgba(255,255,255,.12), 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(150,180,255,.25);
  transition: transform .25s ease;
  -webkit-tap-highlight-color: transparent;
}
#orb::after { /* level ring */
  content: ""; position: absolute; inset: -10px; border-radius: 50%; pointer-events: none;
  box-shadow: 0 0 calc(14px + var(--lvl) * 34px) calc(1px + var(--lvl) * 10px) rgba(255,140,70, calc(.22 + var(--lvl) * .5)), inset 0 0 0 1.5px rgba(255,160,100, calc(.35 + var(--lvl) * .5));
  opacity: 0; transition: opacity .2s;
}
#orb .core { position: absolute; inset: 38%; border-radius: 50%; background: radial-gradient(circle, rgba(255,160,90,.95), rgba(255,122,47,.0) 70%); opacity: .35; transform: scale(calc(1 + var(--lvl) * .9)); transition: opacity .2s; }
#orb[data-state="listening"]::after, #orb[data-state="speaking"]::after { opacity: 1; }
#orb[data-state="listening"] .core, #orb[data-state="speaking"] .core { opacity: 1; }
#orb[data-state="thinking"] .core { opacity: .9; animation: breathe 1.4s ease-in-out infinite; }
#orb:active { transform: scale(.96); }
@keyframes breathe { 50% { transform: scale(1.7); opacity: .45; } }
#status { min-height: 22px; font-size: 14px; color: var(--mist); text-align: center; }

form.type { display: flex; gap: 8px; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
form.type input { flex: 1; min-width: 0; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
form.type input::placeholder { color: var(--mist); }
form.type button { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; }

dialog { border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); width: 100%; max-width: 560px; margin: auto auto 0; background: rgba(12, 22, 56, .92); color: var(--frost); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
dialog::backdrop { background: rgba(3, 6, 15, .6); }
dialog h2 { margin: 0 0 12px; font-size: 18px; }
.field { display: grid; gap: 6px; margin: 14px 0; }
.field > span { font-size: 14px; color: var(--mist); }
.voices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.voices button { text-align: left; background: rgba(61,107,255,.10); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.voices button[aria-pressed="true"] { border-color: var(--ember); background: rgba(255,122,47,.12); }
.voices small { display: block; color: var(--mist); font-size: 12.5px; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
.switch small { display: block; color: var(--mist); font-size: 12.5px; }
input[type="range"] { width: 100%; accent-color: var(--ember); }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--ember); flex: none; }
.sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
.sheet-actions button { flex: 1; background: rgba(61,107,255,.14); border: 1px solid var(--line); border-radius: 14px; padding: 11px; }
.sheet-actions .primary { background: var(--ember); color: #1d0c02; border-color: var(--ember); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { #orb, #orb .core, #orb::after { transition: none; animation: none !important; } }
@media (min-width: 720px) { #log { padding-inline: max(16px, calc(50% - 340px)); } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>Qwen Voice</b><span id="sub">Private, on your PC</span></div>
  <select id="mode" class="chip" aria-label="Thinking mode">
    <option value="qwen3.8-27b:code">Quick</option>
    <option value="qwen3.8-27b">Considered</option>
    <option value="qwen3.8-27b:plan">Deep plan</option>
  </select>
  <button class="icon" id="new" aria-label="New conversation" title="New conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="icon" id="gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
</header>

<main id="log" aria-live="polite"></main>

<div class="stage">
  <button id="orb" data-state="idle" aria-label="Talk"><span class="core"></span></button>
  <div id="status">Tap to talk</div>
</div>

<form class="type" id="typeform">
  <input id="text" placeholder="Or type a message" autocomplete="off" enterkeyhint="send" aria-label="Message">
  <button type="submit">Send</button>
</form>

<dialog id="sheet" aria-label="Settings">
  <h2>Voice settings</h2>
  <div class="field"><span>Voice</span><div class="voices" id="voices"></div></div>
  <label class="field"><span>Speaking speed <output id="speedOut"></output></span><input type="range" id="speed" min="0.85" max="1.3" step="0.05"></label>
  <label class="switch"><span>Read replies aloud<small>Neural voice generated on your PC</small></span><input type="checkbox" id="speak"></label>
  <label class="switch"><span>Hands-free<small>Listens again after each reply and sends when you stop talking</small></span><input type="checkbox" id="handsfree"></label>
  <div class="sheet-actions">
    <button type="button" id="keybtn">Change API key</button>
    <button type="button" class="primary" id="done">Done</button>
  </div>
</dialog>

<script>
const SYS = "You are a private local assistant running on the user's own PC. This is a spoken conversation: reply in 1-4 short natural sentences unless asked for detail; no markdown, lists, tables or code unless asked; write numbers the way you'd say them. Never invent prices, dates or facts - say what you'd need to check.";
// Personalise: add your name, location, units and business context above. Add your own jargon to STT_VOCAB so Whisper spells it right.
const STT_VOCAB = "Qwen, llama.cpp, Vulkan, Arc, GST.";
const VOICES = { emma: ["Emma", "British, warm"], isabella: ["Isabella", "British, bright"], george: ["George", "British, calm"], lewis: ["Lewis", "British, deep"], heart: ["Heart", "American, natural"], michael: ["Michael", "American"] };
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem('qv.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('qv.' + k, JSON.stringify(v)); } catch (e) {} } };
let key = ''; try { key = localStorage.getItem('qwenKey') || ''; } catch (e) {}
const cfg = { voice: store.get('voice', 'emma'), speed: store.get('speed', 1.05), speak: store.get('speak', true), handsfree: store.get('handsfree', false), mode: store.get('mode', 'qwen3.8-27b:code') };
let history = [], busy = false, ttsOK = true, muted = false, ttsFails = 0, turnGen = 0, meterOn = false;

/* ---------- ui helpers ---------- */
const orb = $('orb');
function setState(s, msg) { orb.dataset.state = s; orb.setAttribute('aria-label', { idle: 'Talk', listening: 'Stop and send', thinking: 'Cancel', speaking: 'Stop speaking' }[s]); if (msg !== undefined) status(msg); if (s === 'idle' || s === 'thinking') level(0); }
function status(t) { $('status').textContent = t; }
function level(x) { document.documentElement.style.setProperty('--lvl', Math.max(0, Math.min(1, x)).toFixed(3)); }
function add(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; $('log').appendChild(d); $('log').scrollTop = 1e9; return d; }
function meta(el, parts) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = parts.filter(Boolean).join(', '); el.appendChild(m); }
function askKey() { const k = prompt('Paste your local Qwen API key. It is stored only on this device.', key || ''); if (k) { key = k.trim(); try { localStorage.setItem('qwenKey', key); } catch (e) {} } }

/* ---------- audio output: neural TTS, sentence pipeline ---------- */
let actx = null, outAn = null, playHead = 0, playing = 0, ttsQueue = [], ttsBusy = 0, speechGen = 0, firstVoiceAt = 0;
function audio() {
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); outAn = actx.createAnalyser(); outAn.fftSize = 512; outAn.connect(actx.destination); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function speechText(t) {
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/`([^`]*)`/g, '$1').replace(/\*\*?|__|#{1,6}\s|>\s|\|/g, ' ').replace(/https?:\/\/\S+/g, 'the link').replace(/\s+/g, ' ').trim();
}
function enqueueSpeech(sentence) {
  const t = speechText(sentence); if (muted || !cfg.speak || !t || !/[A-Za-z0-9]/.test(t)) return;
  const gen = speechGen;
  const job = { gen, text: t, buf: null, done: false };
  ttsQueue.push(job); pumpTTS();
}
async function pumpTTS() {
  while (ttsBusy < 2) {
    const job = ttsQueue.find(j => !j.started); if (!job) return;
    job.started = true; ttsBusy++;
    synth(job).finally(() => { ttsBusy--; job.done = true; drain(); pumpTTS(); });
  }
}
async function synth(job) {
  if (!ttsOK) { job.fallback = true; return; }
  try {
    const r = await fetch('/tts', { method: 'POST', signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: job.text, voice: cfg.voice, speed: cfg.speed }) });
    if (!r.ok) throw new Error('tts ' + r.status);
    job.buf = await audio().decodeAudioData(await r.arrayBuffer()); ttsFails = 0;
  } catch (e) { if (++ttsFails >= 3) ttsOK = false; job.fallback = true; }   // one blip falls back for that sentence only; 3 in a row switch to the phone voice
}
function drain() {
  while (ttsQueue.length && ttsQueue[0].done) {
    const job = ttsQueue.shift();
    if (job.gen !== speechGen) continue;
    if (job.buf) playBuffer(job.buf);
    else if (job.fallback) browserSpeak(job.text);
  }
}
function playBuffer(buf) {
  const ctx = audio(); const src = ctx.createBufferSource(); src.buffer = buf; src.connect(outAn);
  const start = Math.max(ctx.currentTime + 0.03, playHead); src.start(start); playHead = start + buf.duration;
  if (!firstVoiceAt) firstVoiceAt = performance.now();
  playing++; setState('speaking', 'Speaking'); meterOut();
  const g = speechGen; src.onended = () => { if (g !== speechGen) return; playing--; if (!playing && !ttsQueue.length && !busy) speechFinished(); };
  (window.__srcs = window.__srcs || []).push(src);
}
function browserSpeak(t) {
  try {
    const u = new SpeechSynthesisUtterance(t); u.lang = 'en-AU'; u.rate = cfg.speed;
    const v = speechSynthesis.getVoices().find(v => v.lang === 'en-AU') || speechSynthesis.getVoices().find(v => v.lang.startsWith('en')); if (v) u.voice = v;
    const g = speechGen; playing++; setState('speaking', 'Answering'); u.onend = u.onerror = () => { if (g !== speechGen) return; playing--; if (!playing && !ttsQueue.length && !busy) speechFinished(); }; speechSynthesis.speak(u);
    if (!firstVoiceAt) firstVoiceAt = performance.now();
  } catch (e) {}
}
function stopSpeaking() {
  speechGen++; ttsQueue = []; playing = 0; playHead = 0;
  (window.__srcs || []).forEach(s => { try { s.stop(); } catch (e) {} }); window.__srcs = [];
  try { speechSynthesis.cancel(); } catch (e) {}
}
function meterOut(loop) {
  if (!loop) { if (meterOn) return; meterOn = true; }   // one animation loop, not one per sentence
  if (orb.dataset.state !== 'speaking' || !outAn) { meterOn = false; return; }
  const d = new Uint8Array(outAn.fftSize); outAn.getByteTimeDomainData(d);
  let s = 0; for (const v of d) s += ((v - 128) / 128) ** 2; level(Math.sqrt(s / d.length) * 5);
  requestAnimationFrame(() => meterOut(true));
}
function speechFinished(autoListen = true) {
  setState('idle', ttsOK ? 'Tap to talk' : 'Neural voice unavailable, used the phone voice');
  if (autoListen && cfg.handsfree) setTimeout(() => { if (orb.dataset.state === 'idle' && !busy) listen(); }, 350);
}

/* ---------- audio input: record, voice-activity stop, Whisper on the PC ---------- */
let micStream = null, rec = null, chunks = [], vadTimer = null;
async function listen() {
  if (listen.pending) return; listen.pending = true;   // a double tap before the mic opens must not start two recorders
  try { await openMic(); } finally { listen.pending = false; }
}
async function openMic() {
  stopSpeaking(); audio();
  if (!micStream || micStream.getTracks().some(t => t.readyState === 'ended'))
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  chunks = []; rec = new MediaRecorder(micStream);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const b = new Blob(chunks, { type: rec.mimeType }); if (!cfg.handsfree) { micStream.getTracks().forEach(t => t.stop()); micStream = null; } transcribe(b); };
  rec.start(); setState('listening', cfg.handsfree ? 'Listening, I will send when you pause' : 'Listening, tap to send');
  vad();
}
function vad() {
  const ctx = audio(); const src = ctx.createMediaStreamSource(micStream); const an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
  const d = new Float32Array(an.fftSize); const t0 = performance.now(); let floor = 0.01, heard = false, lastVoice = t0;
  const tick = () => {
    if (!rec || rec.state !== 'recording') { src.disconnect(); return; }
    const stop = discard => { src.disconnect(); stopListening(discard); };
    an.getFloatTimeDomainData(d); let s = 0; for (const v of d) s += v * v; const rms = Math.sqrt(s / d.length);
    const now = performance.now();
    if (now - t0 < 400) floor = Math.max(floor, rms * 1.6);
    level((rms - floor) * 12);
    if (rms > Math.max(0.02, floor * 2.2)) { heard = true; lastVoice = now; }
    if (cfg.handsfree && heard && now - lastVoice > 1100) return stop();
    if (cfg.handsfree && !heard && now - t0 > 8000) return stop(true);
    if (now - t0 > 60000) return stop();
    requestAnimationFrame(tick);
  };
  tick();
}
function stopListening(discard) {
  if (!rec || rec.state !== 'recording') return;
  if (discard) { rec.onstop = () => { setState('idle', 'Hands-free paused, tap to talk'); }; }
  rec.stop();
}
async function toWav(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)(); const buf = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close();
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2)); const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  return new Blob([out], { type: 'audio/wav' });
}
async function transcribe(blob) {
  setState('thinking', 'Transcribing on your PC'); const t0 = performance.now(); const myTurn = turnGen;
  try {
    const fd = new FormData(); fd.append('file', await toWav(blob), 'speech.wav'); fd.append('response_format', 'json'); fd.append('temperature', '0');
    fd.append('prompt', STT_VOCAB);
    const r = await fetch('/stt/inference', { method: 'POST', body: fd }); const j = await r.json();
    const text = (j.text || '').replace(/\[[^\]]*\]|\([^)]*\)/g, '').trim();
    if (myTurn !== turnGen) return;   // cancelled (orb tap or New) while transcribing
    if (!text) { setState('idle', "Didn't catch that, tap to try again"); return; }
    await ask(text, (performance.now() - t0) / 1000);
  } catch (e) { setState('idle', 'Speech-to-text failed: ' + e.message); }
}

/* ---------- chat: stream tokens, speak sentence by sentence ---------- */
let abortCtl = null;
async function ask(text, heardSecs) {
  if (busy) { setState('idle', 'Still answering, tap the orb to cancel first'); return; } if (!key) askKey(); if (!key) { setState('idle', 'Add your API key in settings'); return; }
  busy = true; stopSpeaking(); muted = false; firstVoiceAt = 0; add('me', text); history.push({ role: 'user', content: text });
  const el = add('ai live', ''); setState('thinking', 'Thinking');
  const t0 = performance.now(); let first = 0, out = '', pending = '';
  abortCtl = new AbortController();
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', signal: abortCtl.signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: cfg.mode, stream: true, max_tokens: 1200, messages: [{ role: 'system', content: SYS }, ...history.slice(-16)] }) });
    if (r.status === 401) throw new Error('key rejected, open settings and paste it again');
    if (!r.ok) throw new Error('server returned ' + r.status);
    const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data:') || l.includes('[DONE]')) continue;
        let d; try { d = JSON.parse(l.slice(5)).choices[0].delta || {}; } catch (e) { continue; }
        const c = d.content || '';
        if (c) {
          if (!first) { first = performance.now(); if (orb.dataset.state === 'thinking') status('Answering'); }
          out += c; pending += c; el.textContent = out; $('log').scrollTop = 1e9;
          let m; while ((m = pending.match(/^([\s\S]{12,}?[.!?])\s+/))) { enqueueSpeech(m[1]); pending = pending.slice(m[0].length); }
        } else if (d.reasoning_content && !first) status('Thinking it through');
      }
    }
    if (pending.trim()) enqueueSpeech(pending);
    history.push({ role: 'assistant', content: out });
    el.classList.remove('live');
    const t = s => (s / 1000).toFixed(1) + ' s';
    meta(el, [heardSecs ? 'heard in ' + heardSecs.toFixed(1) + ' s' : '', first ? 'first words ' + t(first - t0) : '', 'done ' + t(performance.now() - t0)]);
  } catch (e) {
    history.pop(); el.classList.remove('live');
    if (e.name === 'AbortError') { el.textContent = out || 'Cancelled.'; }
    else { el.textContent = 'Could not reach Qwen: ' + e.message + '. Check Tailscale is connected and the PC is on.'; el.classList.add('err'); }
  }
  busy = false; abortCtl = null;
  if (!playing && !ttsQueue.length) speechFinished(!muted);   // no auto-listen after a cancel
}

/* ---------- controls ---------- */
orb.onclick = () => {
  audio();
  const s = orb.dataset.state;
  if (s === 'idle') listen().catch(e => setState('idle', 'Microphone blocked: ' + e.message));
  else if (s === 'listening') stopListening();
  else if (s === 'thinking') { turnGen++; muted = true; stopSpeaking(); if (abortCtl) abortCtl.abort(); setState('idle', 'Cancelled'); }
  else if (s === 'speaking') { muted = true; stopSpeaking(); if (abortCtl) abortCtl.abort(); setState('idle', 'Stopped, tap to talk'); }
};
$('typeform').onsubmit = e => { e.preventDefault(); audio(); const t = $('text').value.trim(); if (t) { $('text').value = ''; ask(t); } };
$('new').onclick = () => { turnGen++; stopSpeaking(); if (abortCtl) abortCtl.abort(); history = []; $('log').innerHTML = ''; setState('idle', 'New conversation'); };

const sheet = $('sheet');
function renderVoices() {
  $('voices').innerHTML = '';
  for (const [id, [name, desc]] of Object.entries(VOICES)) {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', id === cfg.voice);
    b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = name; b.lastChild.textContent = desc;
    b.onclick = () => { cfg.voice = id; store.set('voice', id); renderVoices(); preview(); };
    $('voices').appendChild(b);
  }
}
function preview() { if (orb.dataset.state === 'listening') return; audio(); stopSpeaking(); muted = false; ttsOK = true; ttsFails = 0; enqueueSpeech("Hi, this is how I'll sound."); }
$('gear').onclick = () => { renderVoices(); $('speed').value = cfg.speed; $('speedOut').textContent = cfg.speed.toFixed(2) + '×'; $('speak').checked = cfg.speak; $('handsfree').checked = cfg.handsfree; sheet.showModal(); };
$('done').onclick = () => sheet.close();
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
$('speed').oninput = e => { cfg.speed = +e.target.value; store.set('speed', cfg.speed); $('speedOut').textContent = cfg.speed.toFixed(2) + '×'; };
$('speed').onchange = preview;
$('speak').onchange = e => { cfg.speak = e.target.checked; store.set('speak', cfg.speak); if (!cfg.speak) stopSpeaking(); };
$('handsfree').onchange = e => { cfg.handsfree = e.target.checked; store.set('handsfree', cfg.handsfree); if (!cfg.handsfree && micStream && orb.dataset.state !== 'listening') { micStream.getTracks().forEach(t => t.stop()); micStream = null; } };
$('keybtn').onclick = askKey;
$('mode').value = cfg.mode; $('mode').onchange = e => { cfg.mode = e.target.value; store.set('mode', cfg.mode); };
try { speechSynthesis.getVoices(); } catch (e) {}
fetch('/tts/voices').then(r => { ttsOK = r.ok; }).catch(() => { ttsOK = false; });
if (!key) status('First time: open settings and add your API key');
</script>
