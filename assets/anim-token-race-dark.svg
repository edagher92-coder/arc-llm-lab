<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Same code generated at 16 tokens per second without a draft model (llama-bench) versus 42.3 tokens per second with the DFlash2 draft model (eval-suite throughput) on an Intel Arc Pro B60"><style>text{font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif} .code{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;font-size:15px;fill:#C9D1D9}@media (prefers-reduced-motion: no-preference){@keyframes r0_0{0%,6.67%{clip-path:inset(0 100% 0 0)}15.30%,100%{clip-path:inset(0 0 0 0)}}.r0_0{animation:r0_0 9.0s linear 3 forwards}@keyframes r0_1{0%,15.30%{clip-path:inset(0 100% 0 0)}18.64%,100%{clip-path:inset(0 0 0 0)}}.r0_1{animation:r0_1 9.0s linear 3 forwards}@keyframes r0_2{0%,18.64%{clip-path:inset(0 100% 0 0)}28.11%,100%{clip-path:inset(0 0 0 0)}}.r0_2{animation:r0_2 9.0s linear 3 forwards}@keyframes r0_3{0%,28.11%{clip-path:inset(0 100% 0 0)}37.85%,100%{clip-path:inset(0 0 0 0)}}.r0_3{animation:r0_3 9.0s linear 3 forwards}@keyframes r0_4{0%,37.85%{clip-path:inset(0 100% 0 0)}49.82%,100%{clip-path:inset(0 0 0 0)}}.r0_4{animation:r0_4 9.0s linear 3 forwards}@keyframes r0_5{0%,49.82%{clip-path:inset(0 100% 0 0)}53.44%,100%{clip-path:inset(0 0 0 0)}}.r0_5{animation:r0_5 9.0s linear 3 forwards}@keyframes r0_6{0%,53.44%{clip-path:inset(0 100% 0 0)}61.80%,100%{clip-path:inset(0 0 0 0)}}.r0_6{animation:r0_6 9.0s linear 3 forwards}@keyframes r0_7{0%,61.80%{clip-path:inset(0 100% 0 0)}65.69%,100%{clip-path:inset(0 0 0 0)}}.r0_7{animation:r0_7 9.0s linear 3 forwards}@keyframes d0{0%,65.69%{opacity:0}67.69%,100%{opacity:1}}.d0{animation:d0 9.0s linear 3 forwards}@keyframes r1_0{0%,6.67%{clip-path:inset(0 100% 0 0)}9.93%,100%{clip-path:inset(0 0 0 0)}}.r1_0{animation:r1_0 9.0s linear 3 forwards}@keyframes r1_1{0%,9.93%{clip-path:inset(0 100% 0 0)}11.20%,100%{clip-path:inset(0 0 0 0)}}.r1_1{animation:r1_1 9.0s linear 3 forwards}@keyframes r1_2{0%,11.20%{clip-path:inset(0 100% 0 0)}14.78%,100%{clip-path:inset(0 0 0 0)}}.r1_2{animation:r1_2 9.0s linear 3 forwards}@keyframes r1_3{0%,14.78%{clip-path:inset(0 100% 0 0)}18.46%,100%{clip-path:inset(0 0 0 0)}}.r1_3{animation:r1_3 9.0s linear 3 forwards}@keyframes r1_4{0%,18.46%{clip-path:inset(0 100% 0 0)}22.99%,100%{clip-path:inset(0 0 0 0)}}.r1_4{animation:r1_4 9.0s linear 3 forwards}@keyframes r1_5{0%,22.99%{clip-path:inset(0 100% 0 0)}24.36%,100%{clip-path:inset(0 0 0 0)}}.r1_5{animation:r1_5 9.0s linear 3 forwards}@keyframes r1_6{0%,24.36%{clip-path:inset(0 100% 0 0)}27.52%,100%{clip-path:inset(0 0 0 0)}}.r1_6{animation:r1_6 9.0s linear 3 forwards}@keyframes r1_7{0%,27.52%{clip-path:inset(0 100% 0 0)}28.99%,100%{clip-path:inset(0 0 0 0)}}.r1_7{animation:r1_7 9.0s linear 3 forwards}@keyframes d1{0%,28.99%{opacity:0}30.99%,100%{opacity:1}}.d1{animation:d1 9.0s linear 3 forwards}}</style><rect width="1000" height="420" fill="#0D1117"/><text x="40" y="44" font-size="22" font-weight="700" fill="#E6EDF3">Same 27B model, same Arc Pro B60: 2.6x faster generation with speculative decoding</text><text x="40" y="68" font-size="14" fill="#9DA7B3">Real-time replay at measured speeds, Qwen3.8-27B Q4_K_M, ~85 tokens</text><rect x="40" y="80" width="440" height="270" rx="12" fill="#161B22" stroke="#21262D"/><circle cx="62" cy="102" r="5" fill="#4F7BFF"/><text x="76" y="107" font-size="14" fill="#E6EDF3" font-weight="600">No drafter (stock or Intel FA build)</text><text class="code r0_0" x="62" y="140" xml:space="preserve">def merge_intervals(intervals):</text><text class="code r0_1" x="62" y="164" xml:space="preserve">    out = []</text><text class="code r0_2" x="62" y="188" xml:space="preserve">    for s, e in sorted(intervals):</text><text class="code r0_3" x="62" y="212" xml:space="preserve">        if out and s &lt;= out[-1][1]:</text><text class="code r0_4" x="62" y="236" xml:space="preserve">            out[-1][1] = max(out[-1][1], e)</text><text class="code r0_5" x="62" y="260" xml:space="preserve">        else:</text><text class="code r0_6" x="62" y="284" xml:space="preserve">            out.append([s, e])</text><text class="code r0_7" x="62" y="308" xml:space="preserve">    return out</text><text class="d0" x="458" y="335" text-anchor="end" font-size="15" font-weight="700" fill="#4F7BFF">done in 5.3 s at 16 tok/s</text><rect x="520" y="80" width="440" height="270" rx="12" fill="#161B22" stroke="#21262D"/><circle cx="542" cy="102" r="5" fill="#E8661E"/><text x="556" y="107" font-size="14" fill="#E6EDF3" font-weight="600">arc-llm-lab (Intel FA + DFlash2)</text><text class="code r1_0" x="542" y="140" xml:space="preserve">def merge_intervals(intervals):</text><text class="code r1_1" x="542" y="164" xml:space="preserve">    out = []</text><text class="code r1_2" x="542" y="188" xml:space="preserve">    for s, e in sorted(intervals):</text><text class="code r1_3" x="542" y="212" xml:space="preserve">        if out and s &lt;= out[-1][1]:</text><text class="code r1_4" x="542" y="236" xml:space="preserve">            out[-1][1] = max(out[-1][1], e)</text><text class="code r1_5" x="542" y="260" xml:space="preserve">        else:</text><text class="code r1_6" x="542" y="284" xml:space="preserve">            out.append([s, e])</text><text class="code r1_7" x="542" y="308" xml:space="preserve">    return out</text><text class="d1" x="938" y="335" text-anchor="end" font-size="15" font-weight="700" fill="#E8661E">done in 2.0 s at 42.3 tok/s</text><text x="40" y="395" font-size="12" fill="#9DA7B3">Rates: data/speculative-decoding-sweep.csv (no drafter 16.0 = llama-bench tg32, identical on stock and Intel FA builds; DFlash2 n=7 42.3 = eval-suite throughput, wall-clock; per-request decode 47-58, mean 53.3)</text></svg>