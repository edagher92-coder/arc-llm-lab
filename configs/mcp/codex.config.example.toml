# Merge into ~/.codex/config.toml (Windows: C:\Users\<you>\.codex\config.toml). Alternative: codex mcp add arc-gw -- <command> <args...>
[mcp_servers.arc-gw]
command = "C:\\AI\\gateway\\.venv\\Scripts\\python.exe"
args = ["C:\\AI\\gateway\\gateway.py", "C:\\AI\\gateway\\gateway.json"]
env = { PYTHONIOENCODING = "utf-8" }
startup_timeout_sec = 60
tool_timeout_sec = 120

